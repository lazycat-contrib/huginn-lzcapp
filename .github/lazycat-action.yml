version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: huginn
build:
  toolchains: []
  run_buildscript: false
images:
  - id: huginn
    target: service
    service: huginn
    source: huginn/huginn
    channel: stable
    sort: semver
    # tags look like v2026.11.01 (date based) -- a plain x.y.z would never match
    tag_regex: ^v[0-9]{4}[.][0-9]{1,2}[.][0-9]{1,2}$
    version_regex: ^v(?P<version>[0-9]{4}[.][0-9]{1,2}[.][0-9]{1,2})$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: Huginn
    skip_if_version_exists: true
